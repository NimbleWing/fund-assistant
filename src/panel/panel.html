<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>基金助手</title>
  <link rel="stylesheet" href="./panel.css">
</head>
<body>
  <header>
    <h1>基金助手</h1>
    <span id="version"></span>
    <button id="reload-btn" type="button" title="重载扩展（加载最新构建）">重载</button>
  </header>
  <section class="status" id="status-card" role="button" tabindex="0" aria-label="服务状态（在线点击打开管理页，离线点击启动服务）">
    <span class="dot" id="dot"></span>
    <span id="status-text">检测中…</span>
    <button id="restart-btn" type="button" hidden>重启</button>
  </section>
  <p id="market" hidden>
    <span id="market-name"></span>
    <span id="market-quote"></span>
    <span id="market-status"></span>
  </p>
  <section id="holdings" hidden>
    <h2>持仓估值</h2>
    <ul id="holdings-list"></ul>
    <p id="holdings-time"></p>
  </section>
  <div id="toast"></div>
  <script type="module" src="./panel.js"></script>
</body>
</html>
